<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#07060a" />
  <title>Gloamward</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="480" height="270"></canvas>
  </div>
  <div id="touch" aria-hidden="true">
    <button id="btnL" type="button" aria-label="Left">◀</button>
    <button id="btnDn" type="button" aria-label="Down">▼</button>
    <button id="btnR" type="button" aria-label="Right">▶</button>
    <button id="btnD" type="button" aria-label="Dash">DASH</button>
    <button id="btnJ" type="button" aria-label="Jump">JUMP</button>
    <button id="btnP" type="button" aria-label="Pause">II</button>
  </div>
  <button id="btnFS" type="button" aria-label="Fullscreen" title="Fullscreen">⛶</button>
  <div id="rotate">
    <div class="rotate-icon">📱 ↷</div>
    <div class="rotate-title">Gire o aparelho para a horizontal</div>
    <div class="rotate-sub">Turn your phone sideways. Gloamward is played in landscape.</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
