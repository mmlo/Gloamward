<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Gloamward</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="480" height="270"></canvas>
  </div>
  <div id="touch" aria-hidden="true">
    <button id="btnL" type="button">◀</button>
    <button id="btnR" type="button">▶</button>
    <button id="btnD" type="button">DASH</button>
    <button id="btnJ" type="button">JUMP</button>
    <button id="btnP" type="button">II</button>
  </div>
  <div id="rotate">Turn your phone sideways.<br>Gloamward is played in landscape.</div>
  <script src="game.js"></script>
</body>
</html>
